<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="音准镜图标背景">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17142a" />
      <stop offset="0.55" stop-color="#0b0c14" />
      <stop offset="1" stop-color="#07080c" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#8f7dff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#8f7dff" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <circle cx="256" cy="230" r="210" fill="url(#glow)" filter="url(#blur)" />
</svg>
